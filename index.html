<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Военное картографирование</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        
        #tools-panel {
            width: 60px;
            background-color: #333;
            color: white;
            padding: 10px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .tool-icon {
            width: 40px;
            height: 40px;
            margin: 5px 0;
            background-color: #555;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
        }
        
        .tool-icon:hover {
            background-color: #666;
        }
        
        .tool-icon.active {
            background-color: #0078ff;
        }
        
        #map-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        
        #map {
            flex-grow: 1;
        }
        
        #side-panel {
            width: 300px;
            display: flex;
            flex-direction: column;
            background-color: #f0f0f0;
            border-left: 1px solid #ccc;
        }
        
        #elements-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
            border-bottom: 1px solid #ccc;
        }
        
        #element-settings {
            height: 200px;
            padding: 10px;
            overflow-y: auto;
        }
        
        .element-item {
            padding: 8px;
            margin-bottom: 5px;
            background-color: white;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid #ddd;
            position: relative;
        }
        
        .element-item:hover {
            background-color: #f5f5f5;
        }
        
        .element-item.selected {
            border-color: #0078ff;
            background-color: #e6f2ff;
        }
        
        .element-title {
            font-weight: bold;
            margin-bottom: 3px;
        }
        
        .element-comment {
            font-size: 12px;
            color: #666;
            margin-top: 3px;
        }
        
        .delete-element {
            position: absolute;
            right: 5px;
            top: 5px;
            color: #ff0000;
            cursor: pointer;
            font-size: 14px;
        }
        
        #share-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            z-index: 1000;
            display: none;
            width: 400px;
            max-width: 90%;
        }
        
        #share-code {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }
        
        .control-button {
            margin-top: 5px;
            padding: 8px 15px;
            background: #0078ff;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .control-button:hover {
            background: #005cc8;
        }
        
        #share-header-button {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 8px 15px;
            background: #0078ff;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 14px;
            z-index: 1000;
        }
        
        #share-header-button:hover {
            background: #005cc8;
        }
        
        #share-panel h3 {
            margin-top: 0;
            text-align: center;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .button-group button {
            flex: 1;
        }
        
        .point-marker {
            background-color: #0078ff;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid white;
            cursor: pointer;
        }
        
        .vertex-marker {
            background-color: #ff0000;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            border: 2px solid white;
            cursor: move;
        }
        
        textarea {
            width: 100%;
            box-sizing: border-box;
            margin-top: 5px;
        }
        
        .edit-vertices-btn {
            margin-top: 10px;
            background-color: #ff9800;
        }
        
        .edit-vertices-btn:hover {
            background-color: #e68a00;
        }
        
        .element-popup {
            font-family: Arial, sans-serif;
            padding: 5px;
        }
        
        .popup-title {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }
        
        .popup-length {
            color: #0078ff;
            font-size: 12px;
            margin-bottom: 5px;
        }
        
        .popup-comment {
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
<button id="share-header-button">ПОДЕЛИТЬСЯ</button>
    
    <div id="tools-panel">
        <div class="tool-icon" data-tool="pen">✏️</div>
        <div class="tool-icon" data-tool="rectangle">⬛</div>
        <div class="tool-icon" data-tool="circle">⭕</div>
        <div class="tool-icon" data-tool="text">T</div>
        <div class="tool-icon" data-tool="point">•</div>
        <div class="tool-icon" data-tool="modify">✎</div>
    </div>
    
    <div id="map-container">
        <div id="map"></div>
    </div>
    
    <div id="side-panel">
        <div id="elements-list">
            <h3>Элементы карты</h3>
            <div id="elements-container">
                <!-- Элементы будут добавляться здесь -->
            </div>
        </div>
        <div id="element-settings">
            <h3>Настройки элемента</h3>
            <div id="settings-container">
                <p>Выберите элемент для редактирования</p>
            </div>
        </div>
    </div>
    
    <div id="share-panel">
        <h3>Поделиться картой</h3>
        <input type="text" id="share-code" readonly placeholder="Код карты">
        <div class="button-group">
            <button class="control-button" id="generate-code">Сгенерировать код</button>
            <button class="control-button" id="copy-code">Копировать</button>
        </div>
        <div class="button-group">
            <button class="control-button" id="load-code">Загрузить карту</button>
            <button class="control-button" id="close-share">Закрыть</button>
        </div>
    </div>


    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
// Инициализация карты
        const map = L.map('map').setView([51.505, -0.09], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);
        
        // Переменные для управления состоянием
        let currentTool = null;
        let drawing = false;
        let currentElement = null;
        let elements = [];
        let tempLayer = null;
        let startPoint = null;
        let pathPoints = [];
        let vertexMarkers = [];
        let editingVertices = false;
        let elementPopups = new Map();
        
        // Элементы интерфейса
        const toolIcons = document.querySelectorAll('.tool-icon');
        const elementsContainer = document.getElementById('elements-container');
        const settingsContainer = document.getElementById('settings-container');
        const sharePanel = document.getElementById('share-panel');
        const shareCodeInput = document.getElementById('share-code');
        const generateCodeBtn = document.getElementById('generate-code');
        const copyCodeBtn = document.getElementById('copy-code');
        const loadCodeBtn = document.getElementById('load-code');
        const closeShareBtn = document.getElementById('close-share');
        const shareHeaderBtn = document.getElementById('share-header-button');
        
        // Обработчики инструментов
        toolIcons.forEach(icon => {
            icon.addEventListener('click', function() {
                toolIcons.forEach(i => i.classList.remove('active'));
                
                if (this.dataset.tool === 'modify') {
                    toggleVertexEditing();
                    return;
                }
                
                if (this.classList.contains('active')) {
                    this.classList.remove('active');
                    currentTool = null;
                } else {
                    this.classList.add('active');
                    currentTool = this.dataset.tool;
                }
                
                if (currentElement) {
                    unselectElement();
                }
            });
        });
        
        // Обработчики карты
        map.on('click', function(e) {
            if (!currentTool || editingVertices) return;
            
            if (currentTool === 'pen') {
                if (!drawing) {
                    startDrawing(e.latlng);
                } else {
                    addPointToPath(e.latlng);
                }
            } else if (currentTool === 'rectangle' || currentTool === 'circle') {
                if (!drawing) {
                    startDrawingShape(e.latlng);
                }
            } else if (currentTool === 'text') {
                addText(e.latlng);
            } else if (currentTool === 'point') {
                addPoint(e.latlng);
            }
        });
        
        map.on('mousemove', function(e) {
            if (drawing && currentTool === 'pen' && tempLayer && pathPoints.length > 0) {
                updateTempPath(e.latlng);
            } else if (drawing && (currentTool === 'rectangle' || currentTool === 'circle') && tempLayer) {
                updateShape(e.latlng);
            }
        });
        
        // Обработка нажатия Enter для выхода из режима рисования
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && drawing) {
                finishDrawing();
            }
        });
        
        // Функции для работы с рисованием
        function startDrawing(latlng) {
            drawing = true;
            pathPoints = [latlng];
            
            currentElement = {
                type: 'polyline',
                latlngs: [],
                color: '#ff0000',
                weight: 3,
                id: Date.now(),
                name: 'Новая линия',
                comment: ''
            };
            
            tempLayer = L.polyline([], {
                color: currentElement.color,
                weight: currentElement.weight
            }).addTo(map);
        }
        
        function addPointToPath(latlng) {
            pathPoints.push(latlng);
            currentElement.latlngs = [...pathPoints];
            tempLayer.setLatLngs(pathPoints);
        }
        
        function updateTempPath(latlng) {
            const tempPath = [...pathPoints, latlng];
            tempLayer.setLatLngs(tempPath);
        }
        
        function startDrawingShape(latlng) {
            drawing = true;
            startPoint = latlng;
            
            currentElement = {
                type: currentTool === 'rectangle' ? 'rectangle' : 'circle',
                bounds: [latlng, latlng],
                color: '#ff0000',
                weight: 3,
                fillColor: '#ff0000',
                fillOpacity: 0.5,
                id: Date.now(),
                name: currentTool === 'rectangle' ? 'Новый прямоугольник' : 'Новый круг',
                comment: ''
            };
            
            if (currentTool === 'rectangle') {
                tempLayer = L.rectangle([latlng, latlng], {
                    color: currentElement.color,
                    weight: currentElement.weight,
                    fillColor: currentElement.fillColor,
                    fillOpacity: currentElement.fillOpacity
                }).addTo(map);
            } else {
                tempLayer = L.circle(latlng, {
                    color: currentElement.color,
                    weight: currentElement.weight,
                    fillColor: currentElement.fillColor,
                    fillOpacity: currentElement.fillOpacity,
                    radius: 1
                }).addTo(map);
            }
        }
        
        function updateShape(latlng) {
            if (currentTool === 'rectangle') {
                currentElement.bounds = [startPoint, latlng];
                tempLayer.setBounds(currentElement.bounds);
            } else {
                const radius = startPoint.distanceTo(latlng);
                currentElement.radius = radius;
                tempLayer.setRadius(radius);
            }
        }
        
        function addText(latlng) {
            const text = prompt('Введите текст:');
            if (!text) return;
            
            const element = {
                type: 'text',
                latlng: latlng,
                text: text,
                color: '#000000',
                size: 16,
                id: Date.now(),
                name: 'Новый текст',
                comment: ''
            };
            
            addElementToMap(element);
            addElementToList(element);
        }
        
        function addPoint(latlng) {
            const element = {
                type: 'point',
                latlng: latlng,
                color: '#0078ff',
                id: Date.now(),
                name: 'Новая точка',
                comment: ''
            };
            
            addElementToMap(element);
            addElementToList(element);
        }
        
        function finishDrawing() {
            if (!drawing) return;
            
            drawing = false;
            
            if (currentTool === 'pen') {
                if (pathPoints.length < 2) {
                    map.removeLayer(tempLayer);
                    return;
                }
                currentElement.latlngs = [...pathPoints];
            } else if ((currentTool === 'rectangle' || currentTool === 'circle') && 
                startPoint.distanceTo(currentElement.bounds[1]) < 10) {
                map.removeLayer(tempLayer);
                return;
            }
            
            addElementToMap(currentElement);
            addElementToList(currentElement);
            
            tempLayer = null;
            currentElement = null;
            currentTool = null;
            pathPoints = [];
            
            toolIcons.forEach(icon => icon.classList.remove('active'));
        }
        
        function addElementToMap(element) {
            // Удаляем старый слой, если он существует
            if (element.layer) {
                map.removeLayer(element.layer);
                if (element.popup) {
                    element.layer.unbindPopup();
                }
            }
            
            let layer;
            
            switch(element.type) {
                case 'polyline':
                    layer = L.polyline(element.latlngs, {
                        color: element.color,
                        weight: element.weight
                    });
                    break;
                case 'rectangle':
                    layer = L.rectangle(element.bounds, {
                        color: element.color,
                        weight: element.weight,
                        fillColor: element.fillColor,
                        fillOpacity: element.fillOpacity
                    });
                    break;
                case 'circle':
                    layer = L.circle(element.bounds[0], {
                        color: element.color,
                        weight: element.weight,
                        fillColor: element.fillColor,
                        fillOpacity: element.fillOpacity,
                        radius: element.radius
                    });
                    break;
                case 'text':
                    const divIcon = L.divIcon({
                        html: `<div style="color: ${element.color}; font-size: ${element.size}px;">${element.text}</div>`,
                        className: 'text-label',
                        iconAnchor: [0, 0]
                    });
                    layer = L.marker(element.latlng, {
                        icon: divIcon,
                        interactive: false
                    });
                    break;
                case 'point':
                    const pointIcon = L.divIcon({
                        html: `<div class="point-marker" style="background-color: ${element.color};"></div>`,
                        className: '',
                        iconSize: [14, 14],
                        iconAnchor: [7, 7]
                    });
                    layer = L.marker(element.latlng, {
                        icon: pointIcon
                    });
                    break;
            }
            
            element.layer = layer;
            layer.addTo(map);
            
            // Добавляем элемент в массив, если его там еще нет
            if (!elements.some(el => el.id === element.id)) {
                elements.push(element);
            }
            
            // Создаем popup для элемента
            const popupContent = createPopupContent(element);
            layer.bindPopup(popupContent);
            
            layer.on('click', function(e) {
                if (currentTool || editingVertices) return;
                
                selectElement(element);
                e.originalEvent.stopPropagation();
            });
        }
        
        function createPopupContent(element) {
            let lengthInfo = '';
            
            if (element.type === 'polyline') {
                let totalLength = 0;
                for (let i = 1; i < element.latlngs.length; i++) {
                    totalLength += element.latlngs[i-1].distanceTo(element.latlngs[i]);
                }
                lengthInfo = `<div class="popup-length">Длина: ${Math.round(totalLength)} м</div>`;
            } else if (element.type === 'circle') {
                lengthInfo = `<div class="popup-length">Радиус: ${Math.round(element.radius)} м</div>`;
            }
            
            return `
                <div class="element-popup">
                    <div class="popup-title">${element.name}</div>
                    ${lengthInfo}
                    ${element.comment ? `<div class="popup-comment">${element.comment}</div>` : ''}
                </div>
            `;
        }
        
        function addElementToList(element) {
            // Удаляем старый элемент, если он существует
            const oldItem = document.querySelector(`.element-item[data-id="${element.id}"]`);
            if (oldItem) {
                oldItem.remove();
            }
            
            const item = document.createElement('div');
            item.className = 'element-item';
            item.dataset.id = element.id;
            item.innerHTML = `
                <div class="element-title">${element.name}</div>
                <div>${getElementDescription(element)}</div>
                ${element.comment ? `<div class="element-comment">${element.comment}</div>` : ''}
                <span class="delete-element" title="Удалить">✕</span>
            `;
            
            item.addEventListener('click', function(e) {
                if (!e.target.classList.contains('delete-element')) {
                    selectElement(element);
                }
            });
            
            item.querySelector('.delete-element').addEventListener('click', function(e) {
                e.stopPropagation();
                deleteElement(element);
            });
            
            elementsContainer.appendChild(item);
        }
        
        function getElementDescription(element) {
            switch(element.type) {
                case 'polyline': return `Линия (${element.latlngs.length} точек)`;
                case 'rectangle': return 'Прямоугольник';
                case 'circle': return `Круг (радиус: ${Math.round(element.radius)}м)`;
                case 'text': return `Текст: ${element.text}`;
                case 'point': return 'Точка';
                default: return 'Элемент';
            }
        }
        
        function selectElement(element) {
            unselectElement();
            
            currentElement = element;
            
            // Подсветка в списке
            document.querySelectorAll('.element-item').forEach(item => {
                item.classList.remove('selected');
                if (parseInt(item.dataset.id) === element.id) {
                    item.classList.add('selected');
                }
            });
            
            // Показать настройки
            showElementSettings(element);
            
            // Открыть popup элемента
            if (element.layer && element.layer.getPopup()) {
                element.layer.openPopup();
            }
        }
        
        function unselectElement() {
            if (!currentElement) return;
            
            if (editingVertices) {
                stopVertexEditing();
            }
            
            // Закрыть popup элемента
            if (currentElement.layer && currentElement.layer.getPopup()) {
                currentElement.layer.closePopup();
            }
            
            currentElement = null;
            
            document.querySelectorAll('.element-item').forEach(item => {
                item.classList.remove('selected');
            });
            
            settingsContainer.innerHTML = '<p>Выберите элемент для редактирования</p>';
        }
        
        function showElementSettings(element) {
            let html = `
                <div>
                    <label>Название: </label>
                    <input type="text" value="${element.name}" id="name-setting">
                </div>
                <div>
                    <label>Комментарий: </label>
                    <textarea id="comment-setting" rows="2">${element.comment || ''}</textarea>
                </div>
                <h4>${getElementDescription(element)}</h4>
            `;
            
            switch(element.type) {
                case 'polyline':
                case 'rectangle':
                case 'circle':
                    html += `
                        <div>
                            <label>Цвет линии: </label>
                            <input type="color" value="${element.color}" id="color-setting">
                        </div>
                        <div>
                            <label>Толщина линии: </label>
                            <input type="number" value="${element.weight}" id="weight-setting" min="1" max="10">
                        </div>
                    `;
                    
                    if (element.type !== 'polyline') {
                        html += `
                            <div>
                                <label>Цвет заливки: </label>
                                <input type="color" value="${element.fillColor}" id="fill-color-setting">
                            </div>
                            <div>
                                <label>Прозрачность: </label>
                                <input type="number" value="${element.fillOpacity * 100}" id="opacity-setting" min="0" max="100">%
                            </div>
                        `;
                    }
                    
                    if (element.type === 'polyline') {
                        html += `<button class="control-button edit-vertices-btn" id="edit-vertices">Редактировать вершины</button>`;
                    }
                    break;
                case 'text':
                    html += `
                        <div>
                            <label>Текст: </label>
                            <input type="text" value="${element.text}" id="text-setting">
                        </div>
                        <div>
                            <label>Цвет: </label>
                            <input type="color" value="${element.color}" id="color-setting">
                        </div>
                        <div>
                            <label>Размер: </label>
                            <input type="number" value="${element.size}" id="size-setting" min="8" max="72">
                        </div>
                    `;
                    break;
                case 'point':
                    html += `
                        <div>
                            <label>Цвет: </label>
                            <input type="color" value="${element.color}" id="color-setting">
                        </div>
                    `;
                    break;
            }
            
            html += `<button class="control-button" id="update-element">Обновить</button>`;
            settingsContainer.innerHTML = html;
            
            document.getElementById('update-element').addEventListener('click', function() {
                updateElement(element);
            });
            
            if (element.type === 'polyline') {
                document.getElementById('edit-vertices').addEventListener('click', function() {
                    toggleVertexEditing(element);
                });
            }
        }
        
        function updateElement(element) {
            element.name = document.getElementById('name-setting').value;
            element.comment = document.getElementById('comment-setting').value;
            
            switch(element.type) {
                case 'polyline':
                    element.color = document.getElementById('color-setting').value;
                    element.weight = parseInt(document.getElementById('weight-setting').value);
                    
                    element.layer.setStyle({
                        color: element.color,
                        weight: element.weight
                    });
                    break;
                case 'rectangle':
                case 'circle':
                    element.color = document.getElementById('color-setting').value;
                    element.weight = parseInt(document.getElementById('weight-setting').value);
                    element.fillColor = document.getElementById('fill-color-setting').value;
                    element.fillOpacity = parseInt(document.getElementById('opacity-setting').value) / 100;
                    
                    element.layer.setStyle({
                        color: element.color,
                        weight: element.weight,
                        fillColor: element.fillColor,
                        fillOpacity: element.fillOpacity
                    });
                    break;
                case 'text':
                    element.text = document.getElementById('text-setting').value;
                    element.color = document.getElementById('color-setting').value;
                    element.size = parseInt(document.getElementById('size-setting').value);
                    
                    const divIcon = L.divIcon({
                        html: `<div style="color: ${element.color}; font-size: ${element.size}px;">${element.text}</div>`,
                        className: 'text-label',
                        iconAnchor: [0, 0]
                    });
                    
                    element.layer.setIcon(divIcon);
                    break;
                case 'point':
                    element.color = document.getElementById('color-setting').value;
                    
                    const pointIcon = L.divIcon({
                        html: `<div class="point-marker" style="background-color: ${element.color};"></div>`,
                        className: '',
                        iconSize: [14, 14],
                        iconAnchor: [7, 7]
                    });
                    
                    element.layer.setIcon(pointIcon);
                    break;
            }
            
            // Обновляем элемент на карте и в списке
            addElementToMap(element);
            updateElementInList(element);
        }
        
        function updateElementInList(element) {
            const item = document.querySelector(`.element-item[data-id="${element.id}"]`);
            if (item) {
                item.innerHTML = `
                    <div class="element-title">${element.name}</div>
                    <div>${getElementDescription(element)}</div>
                    ${element.comment ? `<div class="element-comment">${element.comment}</div>` : ''}
                    <span class="delete-element" title="Удалить">✕</span>
                `;
                
                item.querySelector('.delete-element').addEventListener('click', function(e) {
                    e.stopPropagation();
                    deleteElement(element);
                });
                
                if (item.classList.contains('selected')) {
                    item.addEventListener('click', function(e) {
                        if (!e.target.classList.contains('delete-element')) {
                            selectElement(element);
                        }
                    });
                }
            }
        }
        

        function deleteElement(element) {
            if (confirm(`Удалить элемент "${element.name}"?`)) {
                // Удаляем с карты
                if (element.layer) {
                    map.removeLayer(element.layer);
                    // Удаляем все связанные маркеры вершин, если они есть
                    if (element.vertexMarkers) {
                        element.vertexMarkers.forEach(marker => map.removeLayer(marker));
                    }
                }
                
                // Удаляем из списка элементов
                elements = elements.filter(el => el.id !== element.id);
                
                // Удаляем из списка в интерфейсе
                const itemToRemove = document.querySelector(`.element-item[data-id="${element.id}"]`);
                if (itemToRemove) {
                    itemToRemove.remove();
                }
                
                // Если удаляемый элемент был выбран, сбрасываем выбор
                if (currentElement && currentElement.id === element.id) {
                    currentElement = null;
                    settingsContainer.innerHTML = '<p>Выберите элемент для редактирования</p>';
                }
                
                // Полностью перерисовываем карту для гарантии удаления
                refreshMap();
            }
        }

        function refreshMap() {
            // Сохраняем текущий вид карты
            const center = map.getCenter();
            const zoom = map.getZoom();
            
            // Удаляем все слои (кроме базовой карты)
            map.eachLayer(layer => {
                if (layer !== map._layers[Object.keys(map._layers)[0]]) {
                    map.removeLayer(layer);
                }
            });
            
            // Восстанавливаем элементы
            elements.forEach(element => {
                addElementToMap(element);
            });
            
            // Восстанавливаем вид
            map.setView(center, zoom);
        }

 function toggleVertexEditing(element = currentElement) {
            if (!element || element.type !== 'polyline') return;
            
            if (editingVertices) {
                stopVertexEditing();
            } else {
                startVertexEditing(element);
            }
        }
        
        function startVertexEditing(element) {
            editingVertices = true;
            vertexMarkers = [];
            
            // Создаем маркеры для каждой вершины
            element.latlngs.forEach((latlng, index) => {
                const marker = L.marker(latlng, {
                    icon: L.divIcon({
                        html: '<div class="vertex-marker"></div>',
                        className: '',
                        iconSize: [12, 12],
                        iconAnchor: [6, 6]
                    }),
                    draggable: true
                }).addTo(map);
                
                marker.on('drag', function(e) {
                    // Обновляем позицию вершины
                    element.latlngs[index] = e.target.getLatLng();
                    element.layer.setLatLngs(element.latlngs);
                    
                    // Обновляем положение маркера
                    marker.setLatLng(e.target.getLatLng());
                    
                    // Обновляем popup с длиной линии
                    const popupContent = createPopupContent(element);
                    element.layer.setPopupContent(popupContent);
                });
                
                vertexMarkers.push(marker);
            });
            
            // Обновляем кнопку
            const btn = document.getElementById('edit-vertices');
            if (btn) {
                btn.textContent = 'Закончить редактирование';
                btn.classList.add('edit-vertices-btn');
            }
        }
        
        function stopVertexEditing() {
            editingVertices = false;
            
            // Удаляем все маркеры вершин
            vertexMarkers.forEach(marker => map.removeLayer(marker));
            vertexMarkers = [];
            
            // Обновляем кнопку
            const btn = document.getElementById('edit-vertices');
            if (btn) {
                btn.textContent = 'Редактировать вершины';
                btn.classList.add('edit-vertices-btn');
            }
        }
        
        // Функции для работы с обменом картами
        function toggleSharePanel() {
            sharePanel.style.display = sharePanel.style.display === 'block' ? 'none' : 'block';
            if (sharePanel.style.display === 'block') {
                shareCodeInput.value = '';
            }
        }
        
        generateCodeBtn.addEventListener('click', function() {
            const data = {
                center: map.getCenter(),
                zoom: map.getZoom(),
                elements: elements.map(el => {
                    // Создаем копию элемента без ссылки на слой
                    const copy = {...el};
                    delete copy.layer;
                    return copy;
                })
            };
            
            const code = btoa(JSON.stringify(data));
            shareCodeInput.value = code;
        });
        
        copyCodeBtn.addEventListener('click', function() {
            if (!shareCodeInput.value) {
                alert('Сначала сгенерируйте код карты');
                return;
            }
            
            shareCodeInput.select();
            document.execCommand('copy');
            alert('Код скопирован в буфер обмена');
        });
        
        loadCodeBtn.addEventListener('click', function() {
            const code = prompt('Введите код карты:');
            if (!code) return;
            
            try {
                const data = JSON.parse(atob(code));
                
                // Очистить текущую карту
                elements.forEach(el => map.removeLayer(el.layer));
                elements = [];
                elementsContainer.innerHTML = '';
                
                // Установить вид
                map.setView(data.center, data.zoom);
                
                // Добавить элементы
                data.elements.forEach(el => {
                    addElementToMap(el);
                    addElementToList(el);
                });
                
                toggleSharePanel();
                alert('Карта успешно загружена!');
            } catch (e) {
                alert('Ошибка при загрузке карты: неверный код');
                console.error(e);
            }
        });
        
        closeShareBtn.addEventListener('click', toggleSharePanel);
        shareHeaderBtn.addEventListener('click', toggleSharePanel);
    </script>
</body>
</html>
